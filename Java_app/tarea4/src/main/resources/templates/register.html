<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registrarse">
    <title>Registrarse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>
    <header>
        <h1>Bienvenido a PlaceHolder</h1>
    </header>
    <div th:replace="~{fragments/header_base :: navbar}"></div>
    
    <main>
      <div class="register-user">
        <h1>Registrarse</h1>
        <form id="register-form" th:action="@{/register}" method="post">
          <label>
            Nombre de usuario
            <input type="text" name="username" required />
          </label>
          <label>
            Contraseña
            <input type="password" name="password" required />
          </label>
          <button type="submit">Crear cuenta</button>
        </form>
        <p>¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
      </div>
    </main>
  </body>
</html>
