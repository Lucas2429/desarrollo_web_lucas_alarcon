<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Perfil de usuario">
    <title>Perfil de usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=Roboto&display=swap"
      rel="stylesheet"
    />
  </head>

<body>
  <header>
      <h1>Bienvenido a PlaceHolder</h1>
  </header>
  <div th:replace="~{fragments/header_base :: navbar}"></div>

  <main>
    <div class="main-container">
      <h1>👤 Perfil de Usuario</h1>
      <p><strong>Nombre de Usuario:</strong> <span th:text="${user.username}">username</span></p>
      <p><strong>Rol:</strong> <span th:text="${user.role}">ROLE_USER</span></p>
      <p><strong>ID:</strong> <span th:text="${user.id}">1</span></p>

      <a th:href="@{/}" class="button">Volver al inicio</a>
    </div>
  </main>
</body>
</html>
