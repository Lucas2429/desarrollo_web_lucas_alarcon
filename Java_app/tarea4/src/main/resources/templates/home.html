<!-- templates/home.html -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de inicio">
    <title>Inicio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
    <header>
        <h1>Bienvenido a PlaceHolder</h1>
    </header>
    <div th:replace="~{fragments/header_base :: navbar}"></div>
    <main>
        <div class="main-container">
            <h2>Últimas 5 actividades</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th>Inicio</th>
                        <th>Término</th>
                        <th>Comuna</th>
                        <th>Sector</th>
                        <th>Tema</th>
                        <th>Foto</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="actividad : ${actividades}">
                        <td th:text="${actividad.diaHoraInicio}">Inicio</td>
                        <td th:text="${actividad.diaHoraTermino}">Término</td>
                        <td th:text="${actividad.comuna.nombre}">Comuna</td>
                        <td th:text="${actividad.sector}">Sector</td>
                        <td th:text="${#lists.isEmpty(actividad.temas) ? 'Sin tema' : actividad.temas[0].glosaOtro}">Tema</td>
                        <td>Foto</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
